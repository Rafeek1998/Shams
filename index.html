<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For Shams ❤️</title>

<style>
  body{
    margin:0; height:100vh;
    display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#ffb6c1,#ff69b4);
    overflow:hidden; text-align:center;
  }
  h1{ color:#b3003c; font-size:2.4rem; margin:0 12px 22px; }

  .buttons{ position:relative; margin-top:10px; }
  button{
    padding:18px 40px; font-size:26px;
    border:none; border-radius:15px;
    cursor:pointer; margin:10px; font-weight:bold;
    transition:0.15s;
    /* مهم للموبايل: يقلل تأخير/سلوك اللمس */
    touch-action: manipulation;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #yes{ background:#28a745; color:#fff; }
  #no{ background:#dc3545; color:#fff; position:absolute; left:0; top:0; }

  .heart{
    position:absolute; top:-10px; font-size:24px;
    animation: fall linear forwards;
    pointer-events:none;
  }
  @keyframes fall{ to{ transform: translateY(110vh); opacity:0; } }
</style>
</head>

<body>
  <h1>Shams, will you marry me ? 💖</h1>

  <div class="buttons">
    <button id="yes">Yes 😍</button>
    <button id="no">No 😢</button>
  </div>

<script>
  const noBtn = document.getElementById("no");
  const yesBtn = document.getElementById("yes");

  let yesSize = 26;

  function moveNo() {
    // حدود آمنة عشان الزرار ما يطلعش برا الشاشة
    const padding = 100;
    const maxX = window.innerWidth  - noBtn.offsetWidth  - padding;
    const maxY = window.innerHeight - noBtn.offsetHeight - padding;

    const x = Math.random() * Math.max(maxX, 0);
    const y = Math.random() * Math.max(maxY, 0);

    noBtn.style.left = x + "px";
    noBtn.style.top  = y + "px";

    yesSize += 6;
    yesBtn.style.fontSize = yesSize + "px";
  }

  // ✅ الأفضل: Pointer events (شغال ماوس + لمس)
  noBtn.addEventListener("pointerdown", (e) => {
    e.preventDefault();      // يمنع click delay/الـ ghost click
    moveNo();
  });

  // اختياري: لو قربت منه بالماوس على الكمبيوتر
  noBtn.addEventListener("mouseover", moveNo);

  yesBtn.addEventListener("click", () => {
    document.body.innerHTML = `
      <h1 style="color:white; font-size:3rem; margin:30px 12px 0;">
        Yaaay 😍 Shams said YES! 💍❤️
      </h1>
      <h2 style="color:white;">Best Valentine Ever 💖</h2>
    `;
  });

  // ❤️ قلوب بتقع
  function createHeart(){
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = "❤️";
    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.animationDuration = (2 + Math.random() * 3) + "s";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(), 5000);
  }
  setInterval(createHeart, 300);
</script>
</body>
</html>
