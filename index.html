<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>For Shams ❤️</title>

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      font-family:Arial, sans-serif;
      background:linear-gradient(135deg,#ffb6c1,#ff69b4);
      overflow:hidden;
      text-align:center;
      position:relative;
    }

    h1{
      color:#b3003c;
      font-size:2.5rem;
      margin-bottom:30px;
      text-shadow: 0 6px 18px rgba(0,0,0,.12);
      z-index:2;
    }

    button{
      padding:18px 40px;
      font-size:26px;
      border:none;
      border-radius:15px;
      cursor:pointer;
      margin:15px;
      font-weight:bold;
      touch-action: manipulation;
      transition: 0.2s;
      z-index:2;
    }

    #yes{
      background:#24a148;
      color:white;
    }

    #no{
      background:#dc3545;
      color:white;
      position:fixed;
      left:50%;
      top:60%;
      transform:translateX(80px);
      z-index:2;
    }

    /* ❤️ Falling hearts */
    .heart{
      position:fixed;
      top:-20px;
      font-size:22px;
      pointer-events:none;
      animation: fall linear forwards;
      z-index:1;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.15));
    }

    @keyframes fall{
      to{
        transform: translateY(110vh);
        opacity:0;
      }
    }
  </style>
</head>

<body>

<h1>Shams, will you be my Valentine? 💖</h1>

<button id="yes">Yes 😍</button>
<button id="no">No 😢</button>

<script>
  const yesBtn = document.getElementById("yes");
  const noBtn  = document.getElementById("no");

  let yesSize = 26; // starting size

  function moveNo(){
    // Move NO randomly
    const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
    const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);

    noBtn.style.left = x + "px";
    noBtn.style.top  = y + "px";
    noBtn.style.transform = "none";

    // YES grows bigger each time 😈
    yesSize += 8;
    yesBtn.style.fontSize = yesSize + "px";
  }

  // NO runs away when touched/clicked (mobile + PC)
  noBtn.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    moveNo();
  });

  // YES click action ❤️
  yesBtn.addEventListener("click", ()=>{
    document.body.innerHTML =
      "<h1 style='color:white;font-size:3rem;text-shadow:0 12px 30px rgba(0,0,0,.25);'>Yaaay 😍 Shams said YES! 💍❤️</h1>";
  });

  // ❤️ Create falling hearts
  function createHeart(){
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = "❤️";

    heart.style.left = (Math.random() * window.innerWidth) + "px";
    heart.style.fontSize = (18 + Math.random() * 22) + "px";
    heart.style.animationDuration = (2 + Math.random() * 3) + "s";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 5500);
  }

  setInterval(createHeart, 250);
</script>

</body>
</html>
