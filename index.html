<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>For Shams ❤️</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-family:Arial;
  background:linear-gradient(135deg,#ffb6c1,#ff69b4);
  overflow:hidden;
  text-align:center;
}

h1{
  color:#b3003c;
  font-size:2.5rem;
  margin-bottom:30px;
}

.buttons{
  display:flex;
  gap:20px;
  position:relative;
}

button{
  padding:18px 40px;
  font-size:26px;
  border:none;
  border-radius:15px;
  cursor:pointer;
  font-weight:bold;
  transition:0.2s;
  touch-action: manipulation;
}

#yes{
  background:#24a148;
  color:white;
}

#no{
  background:#dc3545;
  color:white;
  position:absolute;
}

/* ❤️ Falling hearts */
.heart{
  position:fixed;
  top:-20px;
  font-size:22px;
  pointer-events:none;
  animation: fall linear forwards;
}

@keyframes fall{
  to{
    transform: translateY(110vh);
    opacity:0;
  }
}
</style>
</head>

<body>

<h1>Shams, will you be my Valentine? 💖</h1>

<div class="buttons">
  <button id="yes">Yes 😍</button>
  <button id="no">No 😢</button>
</div>

<script>
const yesBtn = document.getElementById("yes");
const noBtn  = document.getElementById("no");

let yesSize = 26;

// يخلي No في مكانه الطبيعي الأول
noBtn.style.left = "120px";
noBtn.style.top = "0px";

function moveNo(){
  const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
  const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);

  noBtn.style.position = "fixed";
  noBtn.style.left = x + "px";
  noBtn.style.top  = y + "px";

  yesSize += 6;
  yesBtn.style.fontSize = yesSize + "px";
}

noBtn.addEventListener("pointerdown", moveNo);

yesBtn.addEventListener("click", ()=>{
  document.body.innerHTML =
    "<h1 style='color:white;font-size:3rem;'>Yaaay 😍 Shams said YES! 💍❤️</h1>";
});

// ❤️ Hearts
function createHeart(){
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.textContent = "❤️";
  heart.style.left = Math.random() * window.innerWidth + "px";
  heart.style.animationDuration = (2 + Math.random() * 3) + "s";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),5000);
}

setInterval(createHeart,250);
</script>

</body>
</html>
